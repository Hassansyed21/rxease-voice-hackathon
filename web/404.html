<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Page Not Found | RxEase Voice</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="icon" href="/favicon.ico" sizes="any">
</head>
<body>
  <header><a class="brand" href="/">RxEase</a></header>
  <main class="public-page">
    <h1>Page not found</h1>
    <section class="card">
      <p>This address doesn’t have a page. Search the available pages or return to the demo.</p>
      <label for="page-search">Search pages</label>
      <input type="search" id="page-search" maxlength="80">
      <ul id="page-links">
        <li><a href="/">Care workspace</a></li>
        <li><a href="/privacy-policy">Privacy policy</a></li>
      </ul>
      <p id="search-status" role="status" hidden>No matching pages.</p>
      <a href="/">Back to Home</a>
    </section>
  </main>
  <script src="/page-search.js" defer></script>
</body>
</html>
