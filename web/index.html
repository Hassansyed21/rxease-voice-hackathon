<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="RxEase connects a fictional care journey from check-in to follow-up.">
  <title>RxEase | Care workspace</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header><div class="brand"><span aria-hidden="true" class="mark">+</span>RxEase</div><span class="badge">Synthetic demo</span></header>
  <main>
    <div class="intro">
      <h1 id="workspace-title">Patient workspace</h1>
      <div><label for="role">Demo workspace</label><select id="role"><option>Patient</option><option>Doctor</option><option>Pharmacist</option><option>Lab staff</option><option>Administrator</option></select></div>
    </div>
    <p id="status" role="status" hidden></p>
    <div class="layout">
      <section id="panel" aria-label="Workspace">
        <p>If the workspace stays blank, open <a href="https://rxease.store/">rxease.store</a> in Safari or Chrome with JavaScript enabled.</p>
      </section>
      <aside id="activity" class="card"><h2>Open care items</h2><p id="pending"></p><details id="activity-history"><summary>Care timeline</summary><ol id="timeline"></ol></details></aside>
    </div>
    <template id="caregiver"><section aria-labelledby="workspace-title"><p id="shared"></p><button id="return">Return to patient workspace</button></section></template>
    <footer id="demo-controls" hidden><button id="reset" class="secondary">Reset demo</button></footer>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
