server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  location = /privacy-policy {
    try_files /privacy-policy.html =404;
  }

  location / {
    try_files $uri $uri/ =404;
  }

  error_page 404 /404.html;
  location = /404.html {
    internal;
  }
  location ~ (^|/)\.|^/(api|admin|private|uploads|test|debug)(/|$)|\.(sql|zip|map)$ {
    return 404;
  }
}
